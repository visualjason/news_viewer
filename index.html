<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self'; base-uri 'none'; object-src 'none'"><title>News Viewer · 每日精选</title><link rel="stylesheet" href="styles.css"><script type="module" src="app.js"></script></head>
<body><header><a class="brand" href="#/">● NEWS <b>VIEWER</b></a><span>少读一点，理解更多。</span><button id="archive-toggle" aria-expanded="false" aria-controls="archive">历史日报 ↗</button></header>
<main><aside><small>READ LESS.<br>KNOW WHAT MATTERS.</small><div id="day">—</div><p id="date"></p><hr><small>本期阅读路线</small><nav id="contents"></nav><p class="muted">先看总览，再深入阅读。<br>每一条观点，都有来源。</p></aside><div class="reading">

<section class="hero"><div class="row"><span class="badge">每日精编</span><span id="read-time" class="muted"></span></div><h1 id="headline">正在加载日报…</h1><p id="takeaway"></p><div id="actions" hidden><small>读完可以做什么</small><ul></ul></div></section>
<section><div class="section-title"><small>READ BY CATEGORY</small><h2>按类型深入阅读</h2></div><div class="tools"><label class="search-label">搜索本期<input id="search" type="search" placeholder="标题、摘要、关键词" autocomplete="off"></label><span id="count" aria-live="polite"></span></div><div id="filters" aria-label="分类筛选"></div><div id="stories"></div></section>
<details class="selection"><summary>为什么是这些内容？ <span>筛选说明 ＋</span></summary><div id="selection"></div></details><footer>NEWS VIEWER <span>观点帮助判断，事实回到来源。</span></footer></div></main></body></html>
